name: Release

on:
  push:
    branches:
      - main
      - v[0-9]+.x

jobs:
  build:
    uses: Datadog/action-prebuildify/.github/workflows/build.yml@main
    with:
      target-name: 'dd_pprof' # target name in binding.gyp
      package-manager: 'npm' # npm or yarn
      cache: true # enable caching of dependencies based on lockfile
      min-node-version: 18
      skip: 'linux-arm,linux-ia32' # skip building for these platforms
      node-gyp-build-major: 4

  publish_release:
    needs: build
    runs-on: ubuntu-latest
    # release.yml also runs on main for dev publishes, so keep release publishes on version branches only.
    if: startsWith(github.ref, 'refs/heads/v')
    environment: npm
    permissions:
      id-token: write # Required for OIDC
      contents: read
    steps:
      - uses: DataDog/dd-octo-sts-action@acaa02eee7e3bb0839e4272dacb37b8f3b58ba80 # v1.0.3
        id: octo-sts
        with:
          scope: DataDog/pprof-nodejs
          policy: self.github.release.push-tags
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false # drop GITHUB_TOKEN so the dd-octo-sts token is used for the tag push
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: prebuilds
          path: prebuilds
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - run: npm install
      - run: npm publish
      - id: pkg
        run: |
          content=`cat ./package.json | tr '\n' ' '`
          echo "json=$content" >> $GITHUB_OUTPUT
      - name: Tag release
        run: |
          version="${{ fromJson(steps.pkg.outputs.json).version }}"
          remote="https://x-access-token:${{ steps.octo-sts.outputs.token }}@github.com/${{ github.repository }}.git"
          # Idempotent, so that a rerun after a partial failure can still
          # repair the tag and the release notes.
          if git ls-remote --tags "$remote" "v$version" | grep -q "v$version"; then
            echo "Tag v$version already exists, skipping"
          else
            git tag "v$version"
            git push "$remote" "v$version"
          fi
      - name: Release notes
        env:
          GH_TOKEN: ${{ steps.octo-sts.outputs.token }}
          VERSION: ${{ fromJson(steps.pkg.outputs.json).version }}
        run: |
          # The release notes are the body of the proposal PR, looked up by its
          # head branch. This resolves even after the branch is deleted on merge.
          notes="$RUNNER_TEMP/v$VERSION.md"
          gh pr view "v$VERSION-proposal" --json body --jq .body > "$notes"
          # v5.x is currently the only release line. Once a second one ships,
          # --latest has to be decided per branch rather than hardcoded.
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            gh release edit "v$VERSION" --title "$VERSION" -F "$notes" --latest
          else
            gh release create "v$VERSION" --target "${{ github.ref_name }}" --title "$VERSION" -F "$notes" --latest
          fi

  publish_dev:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: npm
    permissions:
      id-token: write # Required for OIDC
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: prebuilds
          path: prebuilds
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - run: npm install
      - id: pkg
        run: |
          content=`cat ./package.json | tr '\n' ' '`
          echo "json=$content" >> $GITHUB_OUTPUT
      - run: npm version --no-git-tag-version ${{ fromJson(steps.pkg.outputs.json).version }}-$(git rev-parse --short HEAD)+${{ github.run_id }}.${{ github.run_attempt }}
      - run: npm publish --tag dev
