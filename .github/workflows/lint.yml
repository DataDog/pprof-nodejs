name: ci
on:
  push:
    branches:
      - main
  pull_request:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
      - run: npm ci
      - run: npm run lint
  clang-tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
      - run: sudo apt-get update && sudo apt-get install -y clang-tidy
      - run: npm ci
      - run: npm run lint:cpp
